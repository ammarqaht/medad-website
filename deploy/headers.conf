# Security headers (NFR-16). The page CSP ships as a hashed <meta> from Astro;
# frame-ancestors only works as a header, so it lives here.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS: CranL's edge does not add it. Browsers ignore it over plain HTTP, and
# the edge redirects HTTP to HTTPS, so it only ever takes effect over HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
